<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" fill="none" font-family="'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace">
  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1219"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <filter id="shadows" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="860" height="260" rx="14" fill="url(#bgs)" stroke="#1d2530" stroke-width="1" filter="url(#shadows)"/>

  <!-- title bar -->
  <circle cx="52"  cy="48" r="6.5" fill="#ff5f57"/>
  <circle cx="76"  cy="48" r="6.5" fill="#febc2e"/>
  <circle cx="100" cy="48" r="6.5" fill="#58d68d"/>
  <text x="450" y="53" text-anchor="middle" fill="#5b6675" font-size="13">akash@systems — gh api</text>
  <line x1="20" y1="72" x2="880" y2="72" stroke="#1d2530" stroke-width="1"/>

  <!-- command -->
  <text x="52" y="106" font-size="15"><tspan fill="#58d68d">❯</tspan><tspan fill="#c4cbd8" dx="10">gh api users/itsmeakashgoyal --jq stats</tspan></text>

  <!-- stat grid: 4 columns -->
  <g font-size="34" font-weight="700" fill="#7ee787">
    <text x="90"  y="180">26</text>
    <text x="300" y="180">5</text>
    <text x="480" y="180">C++</text>
    <text x="690" y="180">2017</text>
  </g>
  <g font-size="13" fill="#8b96a5">
    <text x="90"  y="205">public repos</text>
    <text x="300" y="205">followers</text>
    <text x="480" y="205">top language</text>
    <text x="690" y="205">joined github</text>
  </g>

  <line x1="52" y1="228" x2="848" y2="228" stroke="#1d2530" stroke-width="1"/>

  <text x="52" y="258" font-size="13" fill="#5b6675">// updated 2026-09-14 · live profile → <tspan fill="#5fb8e0">github.com/itsmeakashgoyal</tspan></text>
</svg>
