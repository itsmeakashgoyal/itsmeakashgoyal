<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" fill="none" font-family="'JetBrains Mono','SF Mono','Cascadia Code','Fira Code',ui-monospace,Consolas,monospace">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1219"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7ee787" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- backdrop grid -->
  <rect x="0" y="0" width="1000" height="620" fill="#0a0d12"/>
  <rect x="0" y="0" width="1000" height="620" fill="url(#grid)"/>

  <!-- window -->
  <rect x="30" y="30" width="940" height="560" rx="16" fill="url(#win)" stroke="#1d2530" stroke-width="1" filter="url(#shadow)"/>

  <!-- title bar -->
  <circle cx="62"  cy="64" r="6.5" fill="#ff5f57"/>
  <circle cx="86"  cy="64" r="6.5" fill="#febc2e"/>
  <circle cx="110" cy="64" r="6.5" fill="#58d68d"/>
  <text x="500" y="69" text-anchor="middle" fill="#5b6675" font-size="13">akash@portfolio: ~</text>
  <rect x="770" y="52" width="86" height="24" rx="6" fill="none" stroke="#2a3340"/>
  <text x="813" y="68" text-anchor="middle" fill="#5b6675" font-size="12">&gt; terminal</text>
  <rect x="864" y="52" width="96" height="24" rx="6" fill="none" stroke="#2a3340"/>
  <text x="912" y="68" text-anchor="middle" fill="#5b6675" font-size="12">theme: dark</text>
  <line x1="30" y1="96" x2="970" y2="96" stroke="#1d2530" stroke-width="1"/>

  <!-- nav -->
  <g font-size="14" fill="#7f8a99">
    <rect x="60"  y="120" width="70"  height="30" rx="15" fill="none" stroke="#2a3340"/><text x="95"  y="140" text-anchor="middle">About</text>
    <rect x="140" y="120" width="66"  height="30" rx="15" fill="none" stroke="#2a3340"/><text x="173" y="140" text-anchor="middle">Skills</text>
    <rect x="216" y="120" width="86"  height="30" rx="15" fill="none" stroke="#2a3340"/><text x="259" y="140" text-anchor="middle">Projects</text>
    <rect x="312" y="120" width="94"  height="30" rx="15" fill="none" stroke="#2a3340"/><text x="359" y="140" text-anchor="middle">Strengths</text>
    <rect x="416" y="120" width="112" height="30" rx="15" fill="none" stroke="#2a3340"/><text x="472" y="140" text-anchor="middle">Testimonials</text>
    <rect x="538" y="120" width="82"  height="30" rx="15" fill="none" stroke="#2a3340"/><text x="579" y="140" text-anchor="middle">Résumé</text>
    <rect x="630" y="120" width="84"  height="30" rx="15" fill="none" stroke="#2a3340"/><text x="672" y="140" text-anchor="middle">Contact</text>
  </g>

  <!-- name + title -->
  <text x="60" y="235" fill="#e6edf3" font-size="42" font-weight="700">Akash Goyal</text>
  <text x="60" y="278" fill="#58d68d" font-size="20" font-weight="600">Senior Software Engineer at Adobe · 11+ Years</text>

  <!-- tagline -->
  <g fill="#8b96a5" font-size="16">
    <text x="60" y="316">Building high-performance distributed systems — from storage backends</text>
    <text x="60" y="342">to blockchain consensus engines. Now at Adobe on GenAI &amp; Agentic AI.</text>
  </g>

  <!-- pills -->
  <g font-size="14" font-weight="600">
    <rect x="60"  y="372" width="72"  height="32" rx="8" fill="#56d4dd" fill-opacity="0.07" stroke="#56d4dd" stroke-opacity="0.6"/><text x="96"  y="393" text-anchor="middle" fill="#56d4dd">Adobe</text>
    <rect x="144" y="372" width="74"  height="32" rx="8" fill="#7ee787" fill-opacity="0.07" stroke="#7ee787" stroke-opacity="0.6"/><text x="181" y="393" text-anchor="middle" fill="#7ee787">C++17</text>
    <rect x="230" y="372" width="176" height="32" rx="8" fill="#e7c664" fill-opacity="0.07" stroke="#e7c664" stroke-opacity="0.6"/><text x="318" y="393" text-anchor="middle" fill="#e7c664">Distributed Systems</text>
    <rect x="418" y="372" width="168" height="32" rx="8" fill="#c792ea" fill-opacity="0.07" stroke="#c792ea" stroke-opacity="0.6"/><text x="502" y="393" text-anchor="middle" fill="#c792ea">GenAI · AgenticAI</text>
    <rect x="598" y="372" width="118" height="32" rx="8" fill="#56d4dd" fill-opacity="0.07" stroke="#56d4dd" stroke-opacity="0.6"/><text x="657" y="393" text-anchor="middle" fill="#56d4dd">Unix · Linux</text>
    <rect x="728" y="372" width="120" height="32" rx="8" fill="#58d68d" fill-opacity="0.07" stroke="#58d68d" stroke-opacity="0.6"/><text x="788" y="393" text-anchor="middle" fill="#58d68d">Open Source</text>
  </g>

  <line x1="60" y1="440" x2="940" y2="440" stroke="#1d2530" stroke-width="1"/>

  <!-- call to action prompt -->
  <g font-size="16">
    <text x="60" y="482"><tspan fill="#58d68d">❯</tspan><tspan fill="#c4cbd8" dx="10">./portfolio</tspan><tspan fill="#c792ea" dx="10">--open</tspan></text>
    <text x="60" y="510"><tspan fill="#7ee787">→</tspan><tspan fill="#8b96a5" dx="10">click anywhere to launch the interactive site</tspan></text>
    <rect x="264" y="469" width="10" height="17" fill="#7ee787">
      <animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- footer -->
  <text x="500" y="562" text-anchor="middle" fill="#5b6675" font-size="13">// built with <tspan fill="#7ee787">♥</tspan> — Akash Goyal · github.com/itsmeakashgoyal</text>
</svg>
