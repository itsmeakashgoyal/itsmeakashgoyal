<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" fill="none" font-family="'JetBrains Mono','SF Mono','Cascadia Code','Fira Code',ui-monospace,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1219"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- window -->
  <rect x="20" y="20" width="860" height="380" rx="14" fill="url(#bg)" stroke="#1d2530" stroke-width="1" filter="url(#shadow)"/>

  <!-- title bar -->
  <g>
    <circle cx="52"  cy="48" r="6.5" fill="#ff5f57"/>
    <circle cx="76"  cy="48" r="6.5" fill="#febc2e"/>
    <circle cx="100" cy="48" r="6.5" fill="#58d68d"/>
    <text x="450" y="53" text-anchor="middle" fill="#5b6675" font-size="13">akash@systems — zsh</text>
  </g>
  <line x1="20" y1="72" x2="880" y2="72" stroke="#1d2530" stroke-width="1"/>

  <!-- body -->
  <g font-size="16.5">
    <!-- whoami -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.2s" fill="freeze"/>
      <text x="52" y="112"><tspan fill="#58d68d">❯</tspan><tspan fill="#c4cbd8" dx="10">whoami</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.55s" fill="freeze"/>
      <text x="52" y="142" fill="#7ee787">Akash Goyal · Systems Engineer · C++ Specialist</text>
    </g>

    <!-- cat profile.txt -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.0s" fill="freeze"/>
      <text x="52" y="188"><tspan fill="#58d68d">❯</tspan><tspan fill="#c4cbd8" dx="10">cat</tspan><tspan fill="#5fb8e0" dx="10">profile.txt</tspan></text>
    </g>
    <g opacity="0" fill="#5b6675">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.25s" fill="freeze"/>
      <text x="52" y="216">// 10+ years building high-performance systems</text>
    </g>
    <g opacity="0" fill="#5b6675">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.45s" fill="freeze"/>
      <text x="52" y="242">// Distributed Systems · Modern C++ · Linux · Docker</text>
    </g>
    <g opacity="0" fill="#5b6675">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.65s" fill="freeze"/>
      <text x="52" y="268">// now → GenAI &amp; Agentic AI @ <tspan fill="#e7c664">Adobe</tspan></text>
    </g>

    <!-- now status -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.1s" fill="freeze"/>
      <text x="52" y="314"><tspan fill="#58d68d">❯</tspan><tspan fill="#c4cbd8" dx="10">./now</tspan><tspan fill="#c792ea" dx="10">--status</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.35s" fill="freeze"/>
      <text x="52" y="342"><tspan fill="#7ee787">→</tspan><tspan fill="#c4cbd8" dx="10">open to backend / server-side · open source · GenAI</tspan></text>
    </g>

    <!-- prompt + blinking cursor -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.7s" fill="freeze"/>
      <text x="52" y="384" fill="#58d68d">❯</text>
      <rect x="72" y="371" width="10" height="18" fill="#7ee787">
        <animate attributeName="opacity" values="1;0" dur="1s" begin="2.9s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
